# ReadyStudy 本地开发环境
#
# 用法：
#   docker compose up -d       # 启动
#   docker compose down        # 停止
#   docker compose logs -f     # 查看日志
#
# 启动后：
#   Postgres:  postgres://readystudy:readystudy@localhost:5432/readystudy
#   Redis:     redis://localhost:6379  (Upstash 协议的轻量替代)

services:
  postgres:
    image: postgres:16-alpine
    container_name: readystudy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: readystudy
      POSTGRES_PASSWORD: readystudy
      POSTGRES_DB: readystudy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readystudy -d readystudy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 本地用 Redis 替代 Vercel KV（同样支持 Upstash SDK 的基本 API）
  redis:
    image: redis:7-alpine
    container_name: readystudy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 可选：本地 MinIO 替代 Vercel Blob（需要额外配置 SDK）
  minio:
    image: minio/minio:latest
    container_name: readystudy-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: readystudy
      MINIO_ROOT_PASSWORD: readystudy123
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    profiles: ["blob"]  # 默认不启动，需要时加 --profile blob

volumes:
  postgres-data:
  redis-data:
  minio-data: