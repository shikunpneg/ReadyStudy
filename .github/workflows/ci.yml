name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint || true

      - name: 格式化校验
        run: pnpm format:check || true

      - name: 构建
        run: pnpm build
        env:
          # CI 环境占位变量，保证 build 能跑通
          AUTH_SECRET: ci_only_secret_replace_me_ci_only_secret_long_xx
          AUTH_URL: http://localhost:3000
          POSTGRES_URL: postgres://ci:ci@localhost:5432/ci
          BYOK_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef