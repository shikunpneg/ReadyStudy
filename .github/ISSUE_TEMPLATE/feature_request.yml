name: Feature Request 功能建议
description: 提出新功能想法
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      placeholder: |
        作为 [角色]，我希望 [做什么]，以便 [达成什么目的]
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 其他上下文
      placeholder: |
        截图、参考产品、相关 issue 链接等
    validations:
      required: false